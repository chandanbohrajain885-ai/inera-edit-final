<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Self-test · Inera Edit Flow</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body class="selftest">
<div class="st-wrap">
  <header class="st-head">
    <img src="logo-mark.png" alt="Inera logo" width="44" height="44">
    <div><h1>Inera Edit Flow — device self-test</h1><p class="muted">Checks what this browser on this computer can do. Nothing is uploaded. Run it once after deploying, and on any new computer.</p></div>
  </header>
  <div class="actions">
    <button class="btn primary" id="stQuick">Run quick checks (no downloads)</button>
    <button class="btn ghost" id="stFull">Full AI test (downloads models once, ~250 MB)</button>
    <a class="btn ghost" href="index.html">Back to the app</a>
  </div>
  <div class="st-list" id="stList"></div>
  <div class="panel st-sum" id="stSum" hidden></div>
</div>
<script type="module" src="self-test.js"></script>
</body>
</html>
